<!doctype html>
<html class="dark" lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Trang chính - Cứt tool</title>
    <!-- Local CSS (offline, Win10 compatible) -->
    <link rel="stylesheet" href="assets/vendor-fonts.css" />
    <link rel="stylesheet" href="style.css" />
    <!-- Tailwind CSS (local bundle) -->
    <script src="assets/vendor/tailwind-cdn.js"></script>
    <!-- Tailwind Config -->
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#2dd4bf",
              secondary: "#2dd4bf",
              background: "#090d16",
              surface: "#090d16",
              "surface-container": "#131b2b",
              "surface-container-high": "#1a2436",
              "surface-container-highest": "#222e44",
              "surface-container-low": "#0d1422",
              "surface-container-lowest": "#070b12",
              "on-background": "#e7edf8",
              "on-surface": "#e7edf8",
              "on-surface-variant": "#8fa0ba",
              outline: "rgba(148, 163, 184, 0.18)",
              "outline-variant": "rgba(148, 163, 184, 0.12)",
              teal: "#2dd4bf",
              "teal-deep": "#0f766e",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              base: "4px",
              sm: "8px",
              lg: "24px",
              xs: "4px",
              "margin-desktop": "40px",
              "margin-mobile": "16px",
              "2xl": "48px",
              "3xl": "64px",
              gutter: "24px",
              xl: "32px",
              md: "16px",
            },
            fontFamily: {
              "body-md": ["Hanken Grotesk", "sans-serif"],
              "headline-md": ["Hanken Grotesk", "sans-serif"],
              "label-sm": ["Hanken Grotesk", "sans-serif"],
            },
          },
        },
      };
    </script>
    <!-- External Stylesheet -->
  </head>
  <body
    class="bg-background text-on-background font-body-md antialiased min-h-screen flex selection:bg-teal selection:text-black"
  >
    <aside
      class="hidden md:flex flex-col bg-surface-container-lowest border-r border-outline/30 fixed left-0 top-0 h-full w-[280px] z-50"
    >
      <div class="flex flex-col flex-1 w-full py-6 overflow-y-auto">
        <div class="px-6 mb-6 flex flex-col items-center text-center">
          <div class="mb-3">
            <img
              src="assets/icon.png"
              alt="Logo"
              class="w-36 h-auto object-contain drop-shadow-md mx-auto"
            />
          </div>
          <h1 class="font-headline-md text-teal font-bold tracking-tight">
            Cứt tool
          </h1>
        </div>
        <nav class="flex-1 flex flex-col gap-1 px-2">
          <a
            class="flex items-center gap-3 px-4 py-3 bg-surface-container-high text-teal border-l-4 border-teal font-label-sm rounded-r-DEFAULT cursor-pointer active:scale-[0.98]"
            href="db.html"
          >
            <span class="material-symbols-outlined">home</span>
            Trang chính
          </a>
          <a
            class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200 font-label-sm border-l-4 border-transparent rounded-r-DEFAULT cursor-pointer active:scale-[0.98]"
            href="cb.html"
          >
            <span class="material-symbols-outlined">apps</span>
            Combo
          </a>
          <a
            class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200 font-label-sm border-l-4 border-transparent rounded-r-DEFAULT cursor-pointer active:scale-[0.98]"
            href="cus.html"
          >
            <span class="material-symbols-outlined">settings_suggest</span>
            Tùy chỉnh
          </a>
        </nav>
      </div>
      <div class="sidebar-actions">
        <button id="runBtn" class="run-btn">
          <span class="btn-dot"></span>
          <span class="material-symbols-outlined" style="font-size:16px">play_arrow</span>
          <span id="runBtnLabel">RUN Macro</span>
        </button>
        <button id="startBtn" class="start-btn">
          <span class="btn-dot"></span>
          <span class="material-symbols-outlined" style="font-size:16px">sports_esports</span>
          <span id="startBtnLabel">START Game</span>
        </button>
      </div>
    </aside>
    <main class="flex-1 w-full md:ml-[280px] relative">
      <div
        class="sticky top-0 w-full h-[320px] z-0 overflow-hidden bg-surface-container-lowest group"
        id="hero-container"
      >
        <div
          class="w-full h-full bg-cover bg-center object-cover transform scale-105 transition-transform duration-1000 ease-out"
          id="hero-image"
          style="background-image: url(&quot;assets/defbanner.png&quot;)"
        ></div>
        <div
          class="absolute inset-0 bg-gradient-to-t from-background via-background/40 to-transparent pointer-events-none"
        ></div>

        <!-- Banner Title & Controls -->
        <div id="bannerTitleContainer" class="absolute top-1/2 left-8 -translate-y-1/2 z-20 flex flex-col items-start gap-3 transition-all duration-500 pointer-events-none">
          <h2 id="bannerAppName" class="text-5xl md:text-6xl font-black text-white drop-shadow-[0_4px_8px_rgba(0,0,0,0.8)] tracking-tight transition-all duration-500">CutTool</h2>
          <p id="bannerAppVersion" class="text-white text-sm md:text-base font-bold drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] px-3 py-1 bg-teal/80 rounded-lg transition-all duration-500">v1.0 beta</p>
        </div>
        <div class="absolute top-4 right-6 z-20 flex items-center gap-2">
          <button
            id="resetBannerBtn"
            title="Đặt lại ảnh bìa mặc định"
            class="hidden bg-surface-container-highest/80 hover:bg-red-500/20 text-on-surface-variant hover:text-red-400 border border-outline/40 hover:border-red-500/40 rounded-lg p-2 text-xs font-semibold backdrop-blur-md shadow-lg transition-all flex items-center justify-center cursor-pointer active:scale-95"
          >
            <span class="material-symbols-outlined text-base">restart_alt</span>
          </button>

          <button
            id="changeBannerBtn"
            title="Thay đổi ảnh bìa trang chính"
            class="bg-surface-container-highest/80 hover:bg-teal/20 text-on-surface hover:text-teal border border-outline/40 hover:border-teal/50 rounded-lg px-3 py-2 text-xs font-semibold backdrop-blur-md shadow-lg transition-all flex items-center gap-1.5 cursor-pointer active:scale-95"
          >
            <span class="material-symbols-outlined text-base">photo_camera</span>
            <span>Đổi ảnh bìa</span>
          </button>
        </div>
        <input type="file" id="bannerFileInput" accept="image/*" class="hidden" />
      </div>
      <div
        class="relative z-10 w-full min-h-screen bg-background rounded-t-[32px] pt-12 pb-32 shadow-[0_-12px_40px_rgba(0,0,0,0.5)] mt-[-40px]"
      >
        <div
          class="max-w-[1200px] mx-auto px-margin-mobile md:px-margin-desktop"
        >
          <!-- 2 Boxes Layout: Fixed Equal Size & Float Left -->
          <div class="w-full boxes-clearfix">
            <div
              class="bg-surface-container border border-outline/40 rounded-xl p-6 shadow-xl box-half-float"
              id="boundCombosBox"
              style="margin-right: 32px"
            >
              <h3
                class="text-lg font-semibold text-teal mb-4 flex items-center gap-2"
              >
                <span class="material-symbols-outlined text-teal"
                  >keyboard</span
                >
                Combo đang sử dụng
              </h3>
              <div
                class="flex flex-col gap-2 overflow-y-auto max-h-[230px] pr-1"
                id="boundCombosList"
              >
                <div
                  class="text-on-surface-variant/60 text-sm py-4 text-center"
                >
                  Đang tải cấu hình...
                </div>
              </div>
            </div>
            <div
              class="bg-surface-container border border-outline/40 rounded-xl p-6 shadow-xl box-half-float flex flex-col justify-between"
              id="statusFpsBox"
            >
              <div>
                <h3
                  class="text-lg font-semibold text-teal mb-4 flex items-center gap-2"
                >
                  <span class="material-symbols-outlined text-teal"
                    >settings</span
                  >
                  Trạng thái Macro
                </h3>

                <!-- Macro FPS Input -->
                <div class="mb-5">
                  <label
                    for="macroFpsInput"
                    class="block text-sm font-medium text-on-surface-variant mb-1.5"
                  >
                    Macro FPS
                  </label>
                  <div class="flex items-center gap-2">
                    <input
                      type="number"
                      id="macroFpsInput"
                      min="1"
                      max="1000"
                      value="120"
                      class="bg-surface-container-high border border-outline/40 text-on-surface rounded-lg px-3 py-2 text-sm w-32 focus:outline-none focus:border-teal font-mono font-semibold"
                    />
                    <button
                      type="button"
                      id="saveFpsBtn"
                      class="bg-teal/15 hover:bg-teal/25 text-teal border border-teal/40 rounded-lg px-3 py-2 text-xs font-semibold transition-colors active:scale-95"
                    >
                      Lưu FPS
                    </button>
                  </div>
                  <p id="fpsSaveMsg" class="text-xs mt-1.5 text-teal h-4 font-medium"></p>
                </div>

                <!-- Macro Status Label -->
                <div>
                  <span
                    class="block text-sm font-medium text-on-surface-variant mb-1.5"
                  >
                    Trạng thái Macro
                  </span>
                  <div
                    id="backendStatusBadge"
                    class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg border text-xs font-semibold transition-all bg-white/5 text-on-surface-variant border-outline/30"
                  >
                    <span id="backendStatusDot" class="w-2 h-2 rounded-full bg-gray-400"></span>
                    <span id="backendStatusText">Đang kiểm tra...</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Row 2: Unlocker & Game Config -->
          <div class="w-full boxes-clearfix mt-6">
            <div
              class="bg-surface-container border border-outline/40 rounded-xl p-6 shadow-xl box-half-float flex flex-col"
              style="margin-right: 32px"
            >
              <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold text-teal flex items-center gap-2">
                  <span class="material-symbols-outlined text-teal">speed</span>
                  Mở khóa FPS
                </h3>
                <label class="relative inline-flex items-center cursor-pointer shrink-0 select-none">
                  <input type="checkbox" id="db_FpsUnlock" class="sr-only peer">
                  <div class="w-11 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-on-surface-variant after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-teal peer-checked:after:bg-black peer-checked:after:border-teal shadow-inner"></div>
                </label>
              </div>
              <div class="mb-4">
                <label class="block text-sm font-medium text-on-surface-variant mb-1.5">FPS mục tiêu</label>
                <input type="number" id="db_TargetFps" min="30" max="1000" class="bg-surface-container-high border border-outline/40 text-on-surface rounded-lg px-3 py-2 text-sm w-32 focus:outline-none focus:border-teal font-mono font-semibold" />
              </div>
              <div class="mt-auto">
                <button type="button" id="db_saveUnlockerBtn" class="bg-teal/15 hover:bg-teal/25 text-teal border border-teal/40 rounded-xl px-4 py-2 text-sm font-semibold transition-colors active:scale-95 w-full flex items-center justify-center gap-2">
                  <span class="material-symbols-outlined text-base">save</span> Lưu Unlocker
                </button>
                <p id="db_unlockerSaveMsg" class="text-xs mt-2 text-teal text-center h-4 font-medium"></p>
              </div>
            </div>

            <div
              class="bg-surface-container border border-outline/40 rounded-xl p-6 shadow-xl box-half-float flex flex-col"
            >
              <h3 class="text-lg font-semibold text-teal mb-4 flex items-center gap-2">
                <span class="material-symbols-outlined text-teal">sports_esports</span>
                Đường dẫn Game
              </h3>
              <div class="flex flex-col gap-3">
                <input type="text" id="db_GamePath" placeholder="C:\Program Files\HoYoPlay\games\Genshin Impact game\GenshinImpact.exe" class="w-full bg-surface-container-high border border-outline/40 rounded-xl px-3 py-2 text-on-surface text-sm focus:border-teal focus:outline-none transition-colors" />
                
                <div class="flex gap-2">
                  <input type="file" id="db_GamePathInput" accept=".exe" class="hidden" />
                  <button type="button" id="db_browseGameBtn" class="bg-surface-container-high hover:bg-surface-container-highest text-on-surface-variant border border-outline/40 rounded-xl px-3 py-2 text-sm font-semibold transition-colors flex items-center justify-center gap-1.5 flex-1">
                    <span class="material-symbols-outlined text-base">folder_open</span> Duyệt file
                  </button>
                  <button type="button" id="db_saveGamePathBtn" class="bg-teal/15 hover:bg-teal/25 text-teal border border-teal/40 rounded-xl px-3 py-2 text-sm font-semibold transition-colors active:scale-95 flex-1">
                    Lưu đường dẫn
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <!-- External JavaScript -->
    <script src="shared.js"></script>
    <script src="db.js"></script>
  </body>
</html>
